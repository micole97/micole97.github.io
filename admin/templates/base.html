<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}Site Admin{% endblock %} — Michael Cole Photography</title>
<link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body>
<header class="admin-header">
  <a href="{{ url_for('dashboard') }}" class="admin-logo">Site Admin</a>
  <nav>
    <a href="{{ url_for('category_view', slug='people') }}">People</a>
    <a href="{{ url_for('category_view', slug='places') }}">Places</a>
    <a href="{{ url_for('category_view', slug='things') }}">Things</a>
    <a href="{{ url_for('posts_list') }}">Personal Posts</a>
    <a href="{{ url_for('publish') }}" class="publish-link">Publish</a>
  </nav>
</header>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="flash">
      {% for m in messages %}<p>{{ m }}</p>{% endfor %}
    </div>
  {% endif %}
{% endwith %}

<main class="admin-main">
  {% block content %}{% endblock %}
</main>

<script src="{{ url_for('static', filename='admin.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
